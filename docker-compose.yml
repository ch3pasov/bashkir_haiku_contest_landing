services:
  nginx_bashkirhaiku:
    image: nginx:latest
    container_name: bashkirhaiku-nginx-container
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./html/:/usr/share/nginx/html/:ro
      - ./nginx/conf/:/etc/nginx/conf.d/:ro
    restart: unless-stopped
    networks:
      - common_network

networks:
  common_network:
    external: true
