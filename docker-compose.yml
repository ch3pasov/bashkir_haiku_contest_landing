version: '3.8'

services:
  nginx_bashkirhaiku:
    image: nginx:latest
    container_name: bashkirhaiku-nginx-container
    ports:
      - "80:80"
    volumes:
      - ./html/:/usr/share/nginx/html/:ro
      - ./nginx/conf/:/etc/nginx/conf.d/:ro
    restart: unless-stopped
    networks:
      - common_network

networks:
  common_network:
    external: true
