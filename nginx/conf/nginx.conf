server {
    listen 80;
    server_name bashkirhaiku.anatoliy.ch;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bashkirhaiku.anatoliy.ch;

    # ssl_certificate /etc/ssl/certs/cert.pem;
    # ssl_certificate_key /etc/ssl/private/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
